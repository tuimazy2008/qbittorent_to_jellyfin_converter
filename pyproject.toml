[project]
name = "jellyprep"
version = "0.2.0"
description = "Prepare finished qBittorrent downloads for a Jellyfin library: identify, rename, hardlink/remux, clean up after seeding."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "guessit>=3.8",
]

[dependency-groups]
dev = ["pytest>=8"]

[project.scripts]
jellyprep = "jellyprep.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jellyprep"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
